<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="zenOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7755"/>
      <stop offset="100%" stop-color="#ff4422"/>
    </linearGradient>
    <filter id="zenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff4422" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Solid Filled Orange Diamond matching header logo .brand-rhombus -->
  <g transform="translate(64, 64) rotate(45)" filter="url(#zenGlow)">
    <rect x="-44" y="-44" width="88" height="88" rx="20" fill="url(#zenOrangeGrad)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.25"/>
  </g>
</svg>
