services:
  # Render Static Site (100% Free Tier, Unlimited CDN)
  - type: web
    name: zen-caption-ai-studio
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
    envVars:
      - key: VITE_SITE_PASSCODE
        value: "7940"
      - key: VITE_MAX_FILE_SIZE_MB
        value: "100"
      - key: VITE_MAX_DURATION_SEC
        value: "300"
      - key: VITE_APP_TITLE
        value: "ZEN CAPTION AI STUDIO"
